name: ci

on:
  pull_request:
  push:
    branches: [main, preview]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Audit-mode egress monitoring: records every outbound connection the
      # runner makes so exfil/C2 from a compromised dependency is detectable.
      # Non-blocking (audit) — does not fail the build.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Classify changed files
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.event.before || github.ref }}
          predicate-quantifier: every
          filters: |
            product:
              - '**'
              - '!*.md'
              - '!*.rst'
              - '!*.adoc'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE*'
              - '!.github/dependabot.yml'
              - '!.github/dependabot.yaml'
              - '!.editorconfig'
            documentation:
              - '{*.md,*.rst,*.adoc,docs/**,book/**}'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        if: steps.changes.outputs.product == 'true'
        # --ignore-scripts blocks dependency lifecycle scripts (the install-time
        # code-exec vector for a compromised package). Modern native deps
        # (esbuild, sharp, rollup) ship prebuilt platform binaries as optional
        # deps and do not need postinstall. If a repo's build genuinely needs a
        # rebuild, that fails only this dep-bump PR's gate (surfaces in triage),
        # never a production build.
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.changes.outputs.product == 'true'
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm run lint
          else
            echo "No lint script — skipping"
          fi

      - name: Build
        if: steps.changes.outputs.product == 'true'
        env:
          POLYMORPHIC_LINT_DOCUMENTATION: ${{ steps.changes.outputs.documentation }}
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            build_cmd=$(jq -r '.scripts.build' package.json)
            if echo "$build_cmd" | grep -qE '(docker-compose|docker compose)'; then
              echo "Docker-based build — skipped in CI"
            else
              npm run build
            fi
          else
            echo "No build script — skipping"
          fi

      - name: Unit tests
        if: steps.changes.outputs.product == 'true'
        # continue-on-error so E2E tests that need a browser/server/DB don't
        # block patch auto-merge. Install + Lint + Build are the real gates
        # for dep-bump compatibility; tests are informational here.
        continue-on-error: true
        run: |
          tests=()
          for test in tests/unit/*.test.mjs; do
            [[ "$test" == 'tests/unit/book-data.test.mjs' ]] || tests+=("$test")
          done
          node --test "${tests[@]}"

      - name: Documentation tests
        if: steps.changes.outputs.documentation == 'true'
        run: |
          node --test tests/unit/book-data.test.mjs
          node scripts/check-book-params.mjs
