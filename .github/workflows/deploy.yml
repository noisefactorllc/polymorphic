name: Deploy

# Successful main CI dispatches an exact source SHA to scaffold. This public
# repository has no server credentials; scaffold builds and deploys both the
# app and the book.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Require product checks for the source SHA
        id: product-checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id,
              filter: 'latest', per_page: 100
            });
            const required = ['Install', 'Build', 'Unit tests'];
            const ran = required.every(name => jobs.some(job =>
              job.name === 'ci' && job.steps?.some(step =>
                step.name === name && step.conclusion === 'success'
              )
            ));
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            const current = branch.commit.sha === context.payload.workflow_run.head_sha;
            core.setOutput('release', String(ran && current));

      - name: Mint scaffold GitHub App token
        if: steps.product-checks.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch verified source SHA
        if: steps.product-checks.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold --ref main \
            -f site=polymorphic -f sha="$SOURCE_SHA" -f require_latest=true
          echo "Dispatched Polymorphic release for $SOURCE_SHA"
